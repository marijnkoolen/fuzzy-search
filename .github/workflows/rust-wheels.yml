# Builds abi3 wheels of the optional Rust backend (rust/, package fuzzy-search-rs) for Linux, macOS and
# Windows, tests each wheel against the Python backend, and uploads them as workflow artifacts.
# Publishing to PyPI is not automated; download the artifacts and upload them with `twine` or
# `maturin upload`.

name: Rust wheels

on:
  push:
    branches: [ "master", "main", "develop" ]
    tags: [ "rs-v*" ]
    paths: [ "rust/**", "fuzzy_search/**", "test/**", ".github/workflows/rust-wheels.yml" ]
  pull_request:
    branches: [ "master" ]
    paths: [ "rust/**", "fuzzy_search/**", "test/**", ".github/workflows/rust-wheels.yml" ]
  workflow_dispatch:

jobs:
  wheels:
    name: ${{ matrix.os }} ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: '2014' }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: '2014' }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2, musl: true }
          - { os: macos-latest, target: universal2-apple-darwin }
          - { os: windows-latest, target: x64 }
          - { os: windows-11-arm, target: aarch64 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: rust
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out dist
      - name: Test wheel
        if: ${{ !matrix.musl }}
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
          python -m pip install --no-index --find-links rust/dist fuzzy-search-rs
          python -c "import fuzzy_search_rs"
          python -m pytest -q test/test_search_rust_backend.py
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}${{ matrix.musl && '-musl' || '' }}
          path: rust/dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: rust
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: rust/dist
