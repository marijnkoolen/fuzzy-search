[package]
name = "fuzzy-search-rs"
version = "0.1.0"
edition = "2021"
description = "Rust backend for the skipgram scan and candidate building of fuzzy-search"
license = "MIT"

[lib]
name = "fuzzy_search_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py310"] }
rayon = "1"
rustc-hash = "2"

[profile.release]
lto = "fat"
codegen-units = 1
